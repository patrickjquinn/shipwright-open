#
# The one place the Reef repository is configured. Sourced (POSIX sh) by the
# installer's scriptlets and by shipwright-reef-repo. Keep in step with
# reef/client/backend/src/repo.rs (RepoConfig::default).
# shellcheck shell=sh disable=SC2034 # variables are used by the sourcing scripts

# ssu repository alias.
REEF_ALIAS=shipwright-reef

# Repository URL. {release} is replaced with the installed release (see
# REEF_RELEASE_GRANULARITY); %(arch) is left for ssu to expand, as Chum does.
# The release is substituted literally, never left as ssu's %(release) or
# %(releaseMajorMinor): those follow `ssu re`, which can run ahead of the
# installed release (docs/plan.md, "Repository mechanics").
REEF_URL_TEMPLATE='https://reefstore.app/sailfishos/{release}/%(arch)/'

# full:        5.2.0.17 (the plan: one repository per installed release)
# major-minor: 5.2      (Chum's layout for Sailfish 5.x, where full-release
#                        paths such as .../chum/5.2.0.15_aarch64/ return 404)
REEF_RELEASE_GRANULARITY=full

# Package the installer installs, and which obsoletes the installer.
REEF_CLIENT_PACKAGE=shipwright-reef

# RPM signing key shipped in the installer, imported with rpm --import.
REEF_KEY_FILE=/usr/share/shipwright-reef-installer/RPM-GPG-KEY-shipwright-reef

# Text in the key's user id; finds its gpg-pubkey package for removal.
REEF_KEY_UID='Shipwright Reef'

# Present once the client package owns the repository registration; the
# installer then leaves the repository alone when it is obsoleted.
REEF_CLIENT_MARKER=/usr/share/shipwright-reef/owns-repository

REEF_LOG=/var/log/shipwright-reef-installer.log
