#
# Lipstick notification category for Reef's update notification
# (src/check.rs), installed to /usr/share/lipstick/notificationcategories/.
# Each key fills in the notification's field or hint when Reef did not set
# it (lipstick's CategoryDefinitionStore). Normal urgency: a popup with the
# preview text check.rs sets, then an entry in Events under "Reef".
appName=Reef
app_icon=icon-lock-application-update
urgency=1
x-nemo-user-removable=true
