#
# Generated by tools/opensource/export.sh: the monorepo's root workspace,
# cut down to the crates published here. Each crate states its own licence.

[workspace]
resolver = "2"
members = [
    "reef/licence",
    "reef/client/backend",
    "keel/actions/rust/keel",
    "keel/actions/rust/keel-macros",
    "keel/actions/schema",
    "keel/actions/codegen",
    "keel/actions/tests/native",
    "keel/actions/mcp",
    "shoal/secrets",
    "shoal/keys/core",
]
# Built by CMake against Qt6 (CXX-Qt), or with their own Cargo workspace.
exclude = ["keel", "shoal/messages", "reef/client/app", "shoal/keys/app"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[profile.release]
lto = true
strip = true
