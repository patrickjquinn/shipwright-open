# Upstream rustup toolchain, newer than the Sailfish SDK's in-SDK Rust (1.75),
# cross-compiling against the SDK sysroot. Phase 0 probe 1 verifies glibc
# compatibility of the resulting binaries on device.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
profile = "minimal"
