# The toolchain Shipwright's SDK scripts use (tools/build/sdk/cargo-sailfish.sh
# cross-compiles with rustup, as the SDK's own Rust is too old for CXX-Qt).
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
profile = "minimal"
