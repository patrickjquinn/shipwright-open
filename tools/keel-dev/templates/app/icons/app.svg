  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#{{icon_color_a}}"/>
      <stop offset="1" stop-color="#{{icon_color_b}}"/>
    </linearGradient>
  </defs>
  <circle cx="86" cy="86" r="82" fill="url(#bg)"/>
  <text x="86" y="86" dy="0.35em" text-anchor="middle" font-family="sans-serif"
        font-size="84" font-weight="bold" fill="#ffffff">{{initial}}</text>
</svg>
