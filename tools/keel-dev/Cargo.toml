[package]
name = "keel-dev"
description = "keel: start a Sailfish app on Keel (keel new) and run it on a desktop (keel run)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
keel-actions-codegen = { path = "../../keel/actions/codegen" }
keel-actions-schema = { path = "../../keel/actions/schema" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
