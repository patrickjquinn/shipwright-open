#
# Per-spec settings for build-rpms.sh (README.md, "Per-spec hooks and
# specs.conf"). A spec not listed here is built with plain
#   mb2 -t <target> --snapshot=<snapshot> -s <spec> build
# from the repository root, after its <component>/rpm/prebuild.sh if any.
#
#   <spec> [dir=<d>] [optin=<VAR>] [needs=<VAR>] [order=<n>] [-- <args>]
#
#   dir=     run mb2 from <d> (the spec path is then taken relative to it)
#   optin=   build only when the environment has <VAR>=1
#   needs=   skip (and say so) unless the environment variable <VAR> is set
#   order=   build order, low first (default 50; ties sort by path)
#   -- ...   arguments after `mb2 ... build --` (shell quoting applies);
#            @ROOT@ is the repository root, @RUST_OUT@ target/<triple>/release

# Keel's Silica module: keel/rpm/prebuild.sh stages the CXX-Qt native part.
keel/rpm/shipwright-keel-silica.spec -- --define "keel_native_dir @ROOT@/target/keel-native"

# Reef embeds the repository's public signing key, which is not in git
# (CI: the REEF_PUBLIC_KEY secret). reef/*/rpm/prebuild.sh copy it in.
reef/installer/rpm/shipwright-reef-installer.spec needs=REEF_KEY_FILE
reef/rpm/shipwright-reef.spec needs=REEF_KEY_FILE

# Opt-in only: ships via Reef after counsel review
# (shoal/bridge-airpods/vendorid/README.md).
shoal/bridge-airpods/rpm/shipwright-shoal-bridge-airpods-vendorid.spec optin=WITH_VENDORID

# CXX-Qt apps staged by their prebuild.sh.
shoal/bridge-icloud/rpm/shipwright-shoal-bridge-icloud.spec -- --with prebuilt
shoal/mail/rpm/shipwright-shoal-mail.spec -- --define "mail_bin @RUST_OUT@/libshipwright_shoal_mail.so"
shoal/migrate/rpm/shipwright-shoal-migrate.spec -- --with gui

# Shoal Messages is a qmake project rooted at shoal/messages; its Rust core
# (matrix-rust-sdk, the largest build) comes from its prebuild.sh. Last, so
# the other packages are done if the disk runs short.
shoal/messages/rpm/shipwright-shoal-messages.spec dir=shoal/messages order=90

# The Phase 0 hello-world, opt-in (tools/phase0/README.md); its prebuild.sh
# builds it with rustup.
tools/phase0/hello-qt6-rust/rpm/shipwright-phase0-hello-qt6.spec optin=WITH_PHASE0 -- --with prebuilt --define "hello_bin @RUST_OUT@/shipwright-hello-qt6"
