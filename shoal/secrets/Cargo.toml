[package]
name = "shoal-secrets"
description = "Shared Sailfish Secrets client (sailfishsecretsd peer-to-peer D-Bus) behind a small secret-store trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[features]
default = ["sailfish"]
# The real backend: peer-to-peer D-Bus to sailfishsecretsd. [device verification]
sailfish = ["dep:zbus", "dep:serde"]
# A fake sailfishsecretsd on a socket pair, for this crate's tests and for
# the tests of the apps that use it (dev-dependency only, never shipped).
test-harness = ["sailfish"]

[dependencies]
log = "0.4"
thiserror = "2"
zeroize = "1.8"
serde = { version = "1", optional = true }
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io", "p2p"] }

[lints]
workspace = true
