[package]
name = "shoal-keys-core"
description = "Shoal Keys: KeePass KDBX 4 vault, TOTP, generator, importers, Sailfish Secrets key wrapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

[features]
default = ["sailfish-secrets", "reef-handoff"]
# The real Sailfish Secrets backend (peer-to-peer D-Bus to sailfishsecretsd).
# Off, only the in-memory and file-free test backends are built.
sailfish-secrets = ["shoal-secrets/sailfish"]
# Ask Reef for the licence token over the session bus at start-up
# (reef_licence::handoff); pasting stays the fallback.
reef-handoff = ["reef-licence/handoff-client"]

[dependencies]
# KDBX 4 read and write. Was pinned to =0.14.0 for the workspace's
# rust-version (1.87); moved to 0.15 on 2026-10-02 (c370c3f2). 0.15 needs
# Rust 1.89, newer than the declared 1.87; the pinned toolchain
# (rust-toolchain.toml, 1.94.1) builds it.
keepass = { version = "0.15", features = ["save_kdbx4"] }
chacha20poly1305 = "0.11"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.4"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
thiserror = "2"
# keepass's Argon2 and UUID types appear in its public API (0.15: rust-argon2 3).
argon2 = { package = "rust-argon2", version = "3" }
uuid = "1"
reef-licence = { path = "../../../reef/licence" }
# The Sailfish Secrets client, shared with Shoal Mail.
shoal-secrets = { path = "../../secrets", default-features = false }

[dev-dependencies]
shoal-secrets = { path = "../../secrets", features = ["test-harness"] }
reef-licence = { path = "../../../reef/licence", features = ["sign"] }

[build-dependencies]
# Embeds SHIPWRIGHT_LICENCE_KEYS as EMBEDDED_KEYS (build.rs).
reef-licence = { path = "../../../reef/licence", features = ["build"] }

[lints]
workspace = true
