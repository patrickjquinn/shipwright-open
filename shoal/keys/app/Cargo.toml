# shipwright-shoal-keys: the Shoal Keys executable. Loads the QML in ../ui
# and exposes the `Keys` singleton (Shipwright.Keys 1.0), a CXX-Qt QObject
# over shoal-keys-core.
#
# Standalone Cargo workspace: the root workspace must list "shoal/keys/app"
# in its `exclude`, and this [workspace] table keeps Cargo from walking up to
# the root manifest (same pattern as reef/client/app).
[workspace]

[package]
name = "shipwright-shoal-keys"
version = "0.1.0"
edition = "2021"
# shoal-keys-core (zbus 5) needs 1.87; cxx-qt 0.10 needs 1.85.
rust-version = "1.87"
license = "GPL-3.0-or-later"
publish = false

# The app is a library built as a shared object that is also executable
# (target/<profile>/libshipwright_shoal_keys.so): the RPM installs it as
# /usr/bin/shipwright-shoal-keys and booster-keel can load it
# (tools/keel-launcher/link_sailfishapp.rs says why it is not a binary).
# Only a cdylib: an rlib next to it would turn off release LTO.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Keel Actions (ADR-0018): keel::manifest!() and the native action table.
keel = { path = "../../../keel/actions/rust/keel" }
# cxx-qt pinned exactly, as in tools/phase0/hello-qt6-rust.
cxx = "1.0.176"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }

shoal-keys-core = { path = "../core" }
reef-licence = { path = "../../../reef/licence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Autofill (src/autofill.rs): matching sites by registrable domain, and the
# answer channel between the D-Bus thread and the GUI thread.
psl = "2"
url = "2"
async-channel = "2"
thiserror = "2"
zeroize = "1.8"
# MCE tklock signal (lock with the device). Same zbus as the core.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
reef-licence = { path = "../../../reef/licence", features = ["sign"] }

[build-dependencies]
# The Keel Actions build step (actions.json, D-Bus files) from the QML.
keel-actions-codegen = { path = "../../../keel/actions/codegen" }
cxx-qt-build = "=0.10.0"
# Compiles libkeel-sailfishapp when no Keel build provides it
# (tools/keel-launcher/link_sailfishapp.rs).
cc = "1"

[lints.clippy]
# Pedantic everywhere; CI runs clippy with -D warnings. Three pedantic lints
# are off, as in keel/silica/plugin: a #[must_use] on every getter and an
# "# Errors" section on every fallible function add boilerplate, not safety,
# and module_name_repetitions fights ordinary Rust naming.
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = true
strip = true
